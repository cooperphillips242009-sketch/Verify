<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        const admins = [
            "https://t.me/pocketcheez",
            "https://t.me/kyle_wakins"
        ];

        let lastIndex = localStorage.getItem("lastAdminIndex");
        let nextIndex;

        if (lastIndex === "0") {
            nextIndex = 1;
        } else if (lastIndex === "1") {
            nextIndex = 0;
        } else {
            nextIndex = new Date().getTime() % 2;
        }

        localStorage.setItem("lastAdminIndex", nextIndex);
        window.location.replace(admins[nextIndex]);
    </script>
</head>
<body>
    <p>Redirecting to admin...</p>
</body>
</html>
